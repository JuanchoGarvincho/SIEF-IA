<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Evaluacion | Jurado ETITC</title>
  <link rel="stylesheet" href="../../Parte_Estudiantes/styles.css" />
  <link rel="stylesheet" href="../assets/jurado.css" />
</head>
<body>
  <div class="jury-phone" data-page="panel">
    <header class="jury-header card">
      <div class="jury-user-row">
        <div class="jury-user">
          <span class="jury-avatar" aria-hidden="true">HR</span>
          <strong>Ing. Helena Rostova</strong>
        </div>
        <button class="jury-icon-btn" type="button" aria-label="Notificaciones">&#128276;</button>
      </div>
    </header>

    <main class="jury-main">
      <section class="jury-section">
        <h1 class="jury-title">Panel de Evaluacion</h1>
        <button class="btn btn--primary jury-scan" type="button">Escanear Codigo QR del Stand</button>
      </section>

      <section class="jury-section">
        <label class="jury-search" for="standSearch">
          <span class="jury-search__icon" aria-hidden="true">&#128269;</span>
          <input id="standSearch" class="field__control" type="search" placeholder="Buscar por stand o titulo" />
        </label>
      </section>

      <section class="jury-section">
        <div class="jury-section__header">
          <h2>Stands por evaluar hoy</h2>
          <span class="jury-count" id="assignedCount">0</span>
        </div>

        <div class="jury-list" id="juryList"></div>
      </section>
    </main>

    <nav class="jury-bottom-nav" aria-label="Navegacion movil">
      <a class="is-active" href="./index.html">Inicio</a>
      <a href="../resultados/index.html">Resultados</a>
      <a href="../../LOGIN/index.html?rol=jurado">Perfil</a>
    </nav>
  </div>

  <script type="module" src="../assets/jurado.js"></script>
</body>
</html>
